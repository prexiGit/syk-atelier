<!doctype html>
<html lang="en">

<body>
  <header data-site-header="overlay"></header>

  <main>
    <section class="hero" aria-labelledby="hero-title">

        <div class="hero-placeholder" aria-hidden="true">
          <!-- Shown until /assets/images/hero.jpg is added -->
          <svg viewBox="0 0 400 400" fill="none" stroke="#62584E" stroke-width="1">
            <circle cx="200" cy="200" r="190" stroke-opacity=".35" />
            <circle cx="200" cy="200" r="150" stroke-opacity=".3" stroke-dasharray="2 6" />
            <g stroke-opacity=".55">
              <path d="M200 40c40 40 40 80 0 120-40-40-40-80 0-120Z" />
              <path d="M360 200c-40 40-80 40-120 0 40-40 80-40 120 0Z" />
              <path d="M200 360c-40-40-40-80 0-120 40 40 40 80 0 120Z" />
              <path d="M40 200c40-40 80-40 120 0-40 40-80 40-120 0Z" />
              <path d="M313 87c0 57-28 85-85 85 0-57 28-85 85-85Z" />
              <path d="M313 313c-57 0-85-28-85-85 57 0 85 28 85 85Z" />

        </div>
        <img src="/assets/images/hero.jpg" alt="A woman wearing a handmade crochet top and headscarf beside a clay vase"
             fetchpriority="high" onerror="this.remove()" />

      <div class="container wide hero-content">
        <div class="inner">

                    <h1 id="hero-title"><span class="line">Crafted with love,</span> <span class="line">worn with soul.</span></h1>

          <div class="actions">
            <a class="btn" id="store-cta" role="link" aria-disabled="true" title="Link coming soon">Explore Yojan Store <span class="arrow" aria-hidden="true">→</span></a>

  <script src="/js/config.js"></script>
  <script src="/vendor/supabase-js-2.119.2.min.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      var url = (window.SYK_CONFIG || {}).STORE_URL;
      var cta = document.getElementById("store-cta");
      if (url) { cta.href = url; cta.removeAttribute("aria-disabled"); cta.removeAttribute("role"); cta.removeAttribute("title"); }
    });
  </script>
